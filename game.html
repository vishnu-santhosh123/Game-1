<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Game</title>
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:#0d1b2a;
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI', Arial, sans-serif;
    overflow:hidden;
    touch-action: manipulation;
  }
  #wrap{ position:relative; width:100%; max-width:420px; aspect-ratio: 9/16; box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  canvas{ display:block; width:100%; height:100%; border-radius:6px; }
  #hud{
    position:absolute; top:16px; left:0; right:0;
    text-align:center; color:white; font-size:2.4rem; font-weight:800;
    text-shadow: 0 3px 6px rgba(0,0,0,0.4);
    pointer-events:none;
    font-family: 'Trebuchet MS', sans-serif;
  }
  #overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: rgba(10,15,25,0.55);
    color:white; text-align:center; padding: 20px;
  }
  #overlay h1{ font-size:1.8rem; margin:0 0 6px; }
  #overlay p{ margin:0 0 18px; opacity:0.85; font-size:0.95rem; }
  #overlay .best{ font-size:0.85rem; opacity:0.7; margin-bottom:22px; }
  #startBtn{
    font-size:1.1rem; font-weight:700; border:none; cursor:pointer;
    background:#FFD34D; color:#3a2a00; padding:12px 30px; border-radius:999px;
    box-shadow:0 5px 0 #c9a12e;
  }
  #startBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #c9a12e; }
  #hint{ position:absolute; bottom:14px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.6); font-size:0.8rem; }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">0</div>
  <div id="overlay">
    <h1 id="overlayTitle">Flappy Game</h1>
    <p id="overlaySub">Tap / click / press space to flap</p>
    <div class="best" id="bestScore"></div>
    <button id="startBtn">Play</button>
  </div>
  <div id="hint">tap anywhere to flap</div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const bestScoreEl = document.getElementById('bestScore');
  const startBtn = document.getElementById('startBtn');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  const GRAVITY = 1500;
  const FLAP_VELOCITY = -430;
  const PIPE_GAP_RATIO = 0.27;
  const PIPE_WIDTH_RATIO = 0.16;
  const PIPE_SPEED = 160;
  const PIPE_INTERVAL = 1450;

  let bird, pipes, score, best, state, lastTime, spawnTimer, groundOffset;
  let elapsed = 0;
  let flapPulse = 0;

  best = parseInt(localStorage.getItem('flappy_best') || '0', 10) || 0;

  function reset(){
    bird = { x: W*0.28, y: H*0.4, r: Math.max(13, W*0.05), vy: 0, rot: 0, wing: 0 };
    pipes = [];
    score = 0;
    spawnTimer = 0;
    groundOffset = 0;
    flapPulse = 0;
    hud.textContent = '0';
  }

  function spawnPipe(){
    const gap = H * PIPE_GAP_RATIO;
    const margin = H * 0.12;
    const centerY = margin + Math.random() * (H - margin*2 - gap) + gap/2;
    pipes.push({ x: W + 40, w: W * PIPE_WIDTH_RATIO, gapCenter: centerY, gap: gap, passed: false });
  }

  function flap(){
    if(state === 'ready'){ startGame(); return; }
    if(state !== 'playing') return;
    bird.vy = FLAP_VELOCITY;
    flapPulse = 1;
  }

  function startGame(){
    reset();
    state = 'playing';
    overlay.style.display = 'none';
    lastTime = performance.now();
  }

  function gameOver(){
    state = 'over';
    if(score > best){ best = score; localStorage.setItem('flappy_best', String(best)); }
    overlayTitle.textContent = 'Game Over';
    overlaySub.textContent = 'Score: ' + score;
    bestScoreEl.textContent = 'Best: ' + best;
    startBtn.textContent = 'Try Again';
    overlay.style.display = 'flex';
  }

  function showReady(){
    state = 'ready';
    overlayTitle.textContent = 'Flappy Game';
    overlaySub.textContent = 'Tap / click / press space to flap';
    bestScoreEl.textContent = best ? ('Best: ' + best) : '';
    startBtn.textContent = 'Play';
    overlay.style.display = 'flex';
  }

  function update(dt){
    elapsed += dt;
    bird.vy += GRAVITY * dt;
    bird.y += bird.vy * dt;
    bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 700));

    flapPulse = Math.max(0, flapPulse - dt*2.2);
    const wingSpeed = 9 + flapPulse*14;
    bird.wing += wingSpeed * dt;

    groundOffset -= PIPE_SPEED * dt;
    if(groundOffset < -40) groundOffset += 40;

    spawnTimer += dt*1000;
    if(spawnTimer > PIPE_INTERVAL){ spawnTimer = 0; spawnPipe(); }

    for(let i = pipes.length-1; i>=0; i--){
      const p = pipes[i];
      p.x -= PIPE_SPEED * dt;
      if(!p.passed && p.x + p.w < bird.x - bird.r){ p.passed = true; score++; hud.textContent = score; }
      if(p.x + p.w < -40) pipes.splice(i,1);
    }

    const groundY = H - 40;
    if(bird.y + bird.r > groundY || bird.y - bird.r < 0){ gameOver(); return; }

    for(const p of pipes){
      const withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w;
      if(withinX){
        const topEnd = p.gapCenter - p.gap/2;
        const botStart = p.gapCenter + p.gap/2;
        if(bird.y - bird.r < topEnd || bird.y + bird.r > botStart){ gameOver(); return; }
      }
    }
  }

  function drawSky(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#3E9BDC');
    g.addColorStop(0.55, '#79C7E8');
    g.addColorStop(0.85, '#BFE9E0');
    g.addColorStop(1, '#E7F5D8');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    const sunX = W*0.78, sunY = H*0.16;
    const glow = ctx.createRadialGradient(sunX,sunY,4, sunX,sunY,60);
    glow.addColorStop(0, 'rgba(255,250,210,0.95)');
    glow.addColorStop(1, 'rgba(255,250,210,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sunX-70, sunY-70, 140, 140);
    ctx.fillStyle = '#FFF6C9';
    ctx.beginPath(); ctx.arc(sunX, sunY, 20, 0, Math.PI*2); ctx.fill();
  }

  function drawClouds(){
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    const speed = 6;
    for(let i=0;i<4;i++){
      const baseX = i*160;
      const cx = (( (baseX - elapsed*speed) % (W+200) ) + (W+200)) % (W+200) - 100;
      const cy = H*0.12 + (i%2)*35;
      cloud(cx, cy, 26 + (i%2)*8);
    }
  }
  function cloud(x,y,s){
    ctx.beginPath();
    ctx.arc(x, y, s*0.6, 0, Math.PI*2);
    ctx.arc(x+s*0.6, y+6, s*0.5, 0, Math.PI*2);
    ctx.arc(x-s*0.6, y+8, s*0.45, 0, Math.PI*2);
    ctx.fill();
  }

  function drawMountains(){
    const speed = 12;
    const offset = (elapsed*speed) % 220;
    ctx.fillStyle = '#8FB89E';
    ctx.globalAlpha = 0.55;
    drawRidge(offset, H*0.62, 55, 220);
    ctx.globalAlpha = 1;
  }

  function drawHills(){
    const speed = 45;
    const offset = (elapsed*speed) % 180;
    ctx.fillStyle = '#6FAE72';
    drawRidge(offset, H*0.72, 40, 180);
  }

  function drawRidge(offset, baseY, height, period){
    ctx.beginPath();
    ctx.moveTo(-period, H);
    for(let x = -period; x < W+period; x += period){
      const px = x - offset;
      ctx.lineTo(px, baseY);
      ctx.lineTo(px + period/2, baseY - height);
      ctx.lineTo(px + period, baseY);
    }
    ctx.lineTo(W+period, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround(){
    const groundY = H - 40;
    const dirtGrad = ctx.createLinearGradient(0, groundY, 0, H);
    dirtGrad.addColorStop(0, '#C99A5B');
    dirtGrad.addColorStop(1, '#A97C42');
    ctx.fillStyle = dirtGrad;
    ctx.fillRect(0, groundY, W, H-groundY);

    ctx.fillStyle = '#5FA24A';
    ctx.fillRect(0, groundY, W, 10);
    ctx.fillStyle = '#4C8B3C';
    for(let x = groundOffset; x < W; x += 14){
      ctx.beginPath();
      ctx.moveTo(x, groundY+2);
      ctx.lineTo(x+4, groundY-6);
      ctx.lineTo(x+8, groundY+2);
      ctx.fill();
    }

    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    for(let x = groundOffset*1.3; x < W; x += 46){
      ctx.fillRect(x, groundY+18, 22, 5);
    }
  }

  function drawPipes(){
    for(const p of pipes){
      const topEnd = p.gapCenter - p.gap/2;
      const botStart = p.gapCenter + p.gap/2;
      drawPipeSegment(p.x, 0, p.w, topEnd, true);
      drawPipeSegment(p.x, botStart, p.w, H-botStart, false);
    }
  }

  function drawPipeSegment(x, y, w, h, isTop){
    const grad = ctx.createLinearGradient(x, 0, x+w, 0);
    grad.addColorStop(0, '#2E8F3B');
    grad.addColorStop(0.18, '#4FBF57');
    grad.addColorStop(0.5, '#6FE07A');
    grad.addColorStop(0.82, '#4FBF57');
    grad.addColorStop(1, '#2E8F3B');
    ctx.fillStyle = grad;
    ctx.fillRect(x, y, w, h);

    const capH = 20;
    const capY = isTop ? y+h-capH : y;
    ctx.fillStyle = '#2E8F3B';
    ctx.fillRect(x-5, capY, w+10, capH);
    const capGrad = ctx.createLinearGradient(x-5,0,x+w+5,0);
    capGrad.addColorStop(0, '#3B9E45');
    capGrad.addColorStop(0.5, '#7BEB84');
    capGrad.addColorStop(1, '#3B9E45');
    ctx.fillStyle = capGrad;
    ctx.fillRect(x-5, capY+3, w+10, capH-6);

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(x, y, 4, h);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(x+w-4, y, 3, h);
  }

  function drawWing(angle, r, color, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(-r*0.1, r*0.05);
    ctx.rotate(angle);
    const wingGrad = ctx.createLinearGradient(0,0,-r*1.1, r*0.2);
    wingGrad.addColorStop(0, color);
    wingGrad.addColorStop(1, '#5C2E17');
    ctx.fillStyle = wingGrad;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-r*0.9, -r*0.15, -r*1.15, r*0.35);
    ctx.quadraticCurveTo(-r*0.6, r*0.5, 0, r*0.15);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawBird(){
    const b = bird;
    const groundY = H - 40;
    const shadowScale = Math.max(0.25, 1 - (groundY - b.y)/H);
    ctx.save();
    ctx.globalAlpha = 0.18 * shadowScale;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(b.x, groundY-2, b.r*1.1*shadowScale, b.r*0.35*shadowScale, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

    const r = b.r;
    const wingAngle = Math.sin(b.wing) * 0.9;

    ctx.fillStyle = '#8A4A2E';
    ctx.beginPath();
    ctx.moveTo(-r*0.9, 0);
    ctx.lineTo(-r*1.7, -r*0.35);
    ctx.lineTo(-r*1.5, 0);
    ctx.lineTo(-r*1.7, r*0.35);
    ctx.closePath();
    ctx.fill();

    drawWing(-wingAngle*0.7, r, '#A0522D', 0.85);

    const bodyGrad = ctx.createRadialGradient(-r*0.2,-r*0.3,r*0.2, 0,0,r*1.3);
    bodyGrad.addColorStop(0, '#E08A4F');
    bodyGrad.addColorStop(0.55, '#C96A32');
    bodyGrad.addColorStop(1, '#9C4A22');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.ellipse(0, 0, r*1.15, r*0.92, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#F3E3C9';
    ctx.beginPath();
    ctx.ellipse(-r*0.05, r*0.32, r*0.72, r*0.42, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#7A3B1E';
    ctx.beginPath();
    ctx.ellipse(r*0.35, -r*0.55, r*0.55, r*0.4, -0.3, 0, Math.PI*2);
    ctx.fill();

    drawWing(wingAngle, r, '#8A4A2E', 1);

    ctx.fillStyle = '#1A1A1A';
    ctx.beginPath();
    ctx.arc(r*0.42, -r*0.18, r*0.15, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(r*0.47, -r*0.24, r*0.05, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#F2A63D';
    ctx.beginPath();
    ctx.moveTo(r*0.95, -r*0.05);
    ctx.lineTo(r*1.55, r*0.05);
    ctx.lineTo(r*0.95, r*0.28);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.restore();
  }

  function loop(now){
    const dt = Math.min(0.032, (now - lastTime)/1000);
    lastTime = now;

    if(state === 'playing'){
      update(dt);
    } else {
      elapsed += dt;
      bird.wing += 6*dt;
    }

    drawSky();
    drawClouds();
    drawMountains();
    drawHills();
    drawPipes();
    drawGround();
    drawBird();

    requestAnimationFrame(loop);
  }

  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); flap(); });
  window.addEventListener('keydown', (e)=>{ if(e.code === 'Space'){ e.preventDefault(); flap(); } });
  startBtn.addEventListener('click', ()=>{ startGame(); });

  reset();
  showReady();
  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
